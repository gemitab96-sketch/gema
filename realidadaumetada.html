<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - TrabajoClases</title>
    <!-- Importa el componente model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            font-size: 0.95rem;
            color: #7f8c8d;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        model-viewer {
            width: 100%;
            height: 400px;
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        /* Estilo para el botón de Realidad Aumentada nativo */
        model-viewer::part(default-ar-button) {
            background-color: #3498db;
            color: white;
            border-radius: 20px;
            padding: 10px 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>Visualizador AR</h1>
        <p>TrabajoClases - Realidad Aumentada</p>
    </header>

    <div class="container">
        <!-- Elemento Model Viewer -->
        <model-viewer 
            src="TrabajoClases.glb" 
            ios-src="" 
            alt="Modelo 3D de TrabajoClases" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1">
        </model-viewer>

        <div class="instructions">
            Gira el modelo con tu dedo en la pantalla. 
            Presiona el botón <strong>"Ver en tu espacio"</strong> para activar la Realidad Aumentada en tu teléfono.
        </div>
    </div>

</body>
</html>
