<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Práctica</title>
    <!-- Importar el componente model-viewer de Google -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Contenedor principal del visor 3D */
        model-viewer {
            width: 100%;
            max-width: 500px;
            height: 450px;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Estilo para el botón de Realidad Aumentada nativo */
        #ar-button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s;
        }

        #ar-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Visualizador de Realidad Aumentada</h1>
        <p>Gira el modelo en la pantalla o presiónalo para verlo en tu espacio real.</p>
    </header>

    <!-- Visor 3D y AR -->
    <model-viewer 
        src="practica.glb" 
        ios-src=""
        alt="Modelo 3D de práctica" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
        
        <!-- Botón personalizado para activar AR -->
        <button slot="ar-button" id="ar-button">
            Ver en tu espacio (AR)
        </button>
    </model-viewer>

</body>
</html>
